stacks:
  names:
    mystack:
      tag_query: ''

engine:
  name: tofu

# The [run] step that names a program which does not exist is what makes the plan fail; the test
# waits for that program name in the plan output.  The [init] and [plan] steps after it never
# execute, but they must be in the list: a [plan] list with no [plan] step makes the whole repo
# config invalid, and then the test gets a config error instead.
workflows:
  - tag_query: 'stack_name:mystack'
    plan:
      - type: run
        cmd: ['thisprogramdoesnotexist']
      - type: init
      - type: plan
